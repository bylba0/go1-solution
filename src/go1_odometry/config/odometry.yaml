# T4: параметры узла go1_odometry (загружаются из go1_bringup/launch/t4.launch.py).
# Пороги ТЗ_T4 (раздел 6): /odom и TF ≥ 20 Гц sim → публикуем 50 Гц; RPE ≤ 20 %; дрейф ≤ 0,10 м и ≤ 5° за 10 с.
go1_odometry:
  ros__parameters:
    imu_topic: /imu/data
    joint_states_topic: /joint_states
    foot_force_topic: /foot_force
    scan_topic: /scan           # только в режиме lidar (подписка RELIABLE)
    odom_topic: /odom
    odom_frame: odom
    base_frame: trunk
    publish_tf: true
    update_rate: 200.0          # Гц sim: расчёт (суставы приходят ~990 Гц, берётся последнее)
    publish_rate: 50.0          # Гц sim: /odom и TF (ТЗ: ≥ 20)
    use_foot_force: false       # /foot_force — необязательный сигнал опоры (без него основной режим)
    foot_force_order: [FL, FR, RL, RR]   # порядок каналов /foot_force (по корреляции с кинематикой на bag A)
    foot_force_threshold: 5.0
    pose_covariance_diagonal: [0.01, 0.01, 0.01, 0.001, 0.001, 0.003]
    twist_covariance_diagonal: [0.01, 0.01, 0.01, 0.01, 0.01, 0.01]
    diag_period: 10.0           # с wall: строка диагностики (паузы /odom, сканы, время сопоставления)
    lidar:
      leg_scale: 1.0            # множитель пути по ногам в прогнозе ядра lidar (1,0 — штатная высота корпуса)
      worker_thread: true       # сопоставление сканов в отдельном потоке (false — синхронно, только для тестов)
    estimator:
      mode: lidar               # legs — IMU + кинематика ног; lidar — IMU + /scan + ноги (lidar_core); launch: estimator_mode:=lidar
      # Страховка режима lidar (go1_odometry/fallback.py; в legs не действует), всё — по sim time:
      scan_timeout: 1.0              # с: /scan не приходил дольше (или поза ядра старше) — xy по приращениям legs
                                     # от последнего выхода (без скачка); 1 с = 20 пропущенных сканов при 20 Гц
      fallback_resume_delay: 0.5     # с: сканы снова идут столько — возврат к lidar (ядро успевает само сопоставить
                                     # первые сканы и ввести свою поправку, BLEND_TAU 0,2 с)
      fallback_blend_tau: 1.0        # с: постоянная экспоненциального ввода поправки при возврате (lidar − наш выход);
                                     # 1 с: поправка 0,25 м вводится не быстрее 0,25 м/с — без рывка за тик 50 Гц
      fallback_max_correction: 0.25  # м: поправка больше — не вводится (ядро правит расхождение лишь в пределах
                                     # PAIR_DIST 0,3 м; дальше его абсолютная поза сомнительна): lidar ведёт приращения
      orientation_mode: imu    # imu — кватернион /imu/data; gyro — запасной (интегрирование угловой скорости)
      heading_reference: world  # world — стартовый курс = мировой yaw IMU; initial — курс от 0 на старте
      stance_height: 0.005
      zupt_foot_speed: 0.01
      zupt_ang_speed: 0.02
      max_dt: 0.1
      foot_radius: 0.02
      initial_height: 0.29
      height_alpha: 0.02
      twist_alpha: 0.2
      contact_timeout: 0.1
